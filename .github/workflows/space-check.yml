# Checks the voice Space from outside: GitHub's runners reach hf.space even where a local network blocks it.
name: Raven API check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Config and CORS for the Pages origin
        run: |
          curl -sS -D headers.txt -o config.json --max-time 300 \
            -H "Origin: https://kaanklcrsln.github.io" https://kaanklcrsln-raven-api.hf.space/config
          grep -iE "^HTTP|access-control-allow-origin" headers.txt
          python3 -c "import json; c = json.load(open('config.json')); print('gradio', c.get('version'), '| ssr', c.get('is_ssr', c.get('ssr_mode')), '| api', [d.get('api_name') for d in c.get('dependencies', []) if d.get('api_name')])"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Speak a sentence
        run: |
          pip install -q gradio_client
          python - <<'PY'
          import base64, time
          from gradio_client import Client
          c = Client("kaanklcrsln/raven-api", verbose=False)
          t = time.perf_counter()
          out = c.predict(text="Merhaba, ben Raven. Sana nasıl yardımcı olabilirim?", speed=1.0, seed=7, sample_rate=24000, api_name="/speak")
          wav = base64.b64decode(out["audio"])
          assert wav[:4] == b"RIFF" and out["duration"] > 0.5, out
          print(f"speak OK: {out['duration']:.2f} s of audio, {len(wav)} bytes, {time.perf_counter() - t:.1f} s")
          PY

  browser:
    # The site's own path: a page on the Pages origin connects to the Space with @gradio/client and asks for speech.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Speak through the browser client from the Pages origin
        run: |
          npm init -y > /dev/null
          npm install --no-fund --no-audit playwright > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          cat > check.mjs <<'JS'
          import { chromium } from 'playwright'
          const browser = await chromium.launch()
          const page = await browser.newPage()
          const log = []
          page.on('console', m => log.push(`console.${m.type()}: ${m.text()}`))
          page.on('requestfailed', r => log.push(`failed: ${r.url()} ${r.failure()?.errorText}`))
          page.on('response', r => { if (r.status() >= 400) log.push(`HTTP ${r.status()} ${r.url()}`) })
          await page.addInitScript(() => localStorage.setItem('raven.geminiKey', 'placeholder'))
          await page.goto('https://kaanklcrsln.github.io/raven/', { waitUntil: 'networkidle' })
          await page.waitForTimeout(15000)
          console.log('site footnote:', (await page.textContent('.footnote'))?.trim())
          const result = await page.evaluate(async () => {
            try {
              const { Client } = await import('https://cdn.jsdelivr.net/npm/@gradio/client@2.7.1/+esm')
              const client = await Client.connect('kaanklcrsln/raven-api')
              const r = await client.predict('/speak', { text: 'Merhaba, ben Raven.', speed: 1, seed: 7, sample_rate: 24000 })
              return `speak OK: ${r.data[0].duration.toFixed(2)} s`
            } catch (e) {
              return `speak FAILED: ${e instanceof Error ? e.message : JSON.stringify(e)}`
            }
          })
          console.log(result)
          console.log(log.join('\n') || 'no console errors or failed requests')
          await browser.close()
          if (!result.startsWith('speak OK')) process.exit(1)
          JS
          node check.mjs
