# Builds raven-web and publishes it on GitHub Pages.
# The voice Space it talks to comes from the repository variable RAVEN_SPACE ("user/raven-api").
name: Raven Web → GitHub Pages

on:
  push:
    branches: [main]
    paths: ['raven-web/**', 'kirby-avatar/**', 'Bagel_Fat_One/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raven-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: raven-web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_RAVEN_SPACE: ${{ vars.RAVEN_SPACE }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: raven-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
